# Urban Green-Cover Intelligence and Historical Change Analysis System
# Single Control Panel Configuration

project_name: "urban-green-cover-bengaluru"

# Slot 1: Data Source
# Options: planetary_computer | gee | sentinel_hub | local_files
data_source: "gee"

# Slot 2: Sensors
# Options: landsat_c2 | sentinel2 | both
sensors: "landsat_c2"

# Slot 3: Target Years
# Options: list of integer years
years:
  - 2000
  - 2010
  - 2020
  - 2025

# Slot 4: Season
# Options: month range (1-12)
season:
  months: [1, 2, 3] # January through March (dry season)
  max_cloud_cover_percent: 25.0

# Slot 5: Composite Method
# Options: median | mean | greenest_pixel
composite: "median"

# Slot 6: Green Index
# Options: ndvi | evi | savi | msavi
green_index: "ndvi"

# Slot 7: Green Threshold & Classification Tiers
# Options: fixed | otsu | adaptive | multi_class
green_threshold:
  method: "fixed"
  cutoff: 0.40 # Justified in docs/DECISIONS.md: isolates dense/tree canopy foliage
  classes:
    non_vegetated: 0.20
    sparse: 0.30
    moderate: 0.40
    dense: 1.00

# Slot 8: Zones System
# Options: grid_1km | grid_500m | wards_geojson | custom_file
zones:
  type: "grid_1km"
  grid_size_meters: 1000
  wards_path: "data/zones/bbmp_wards.geojson"
  custom_path: ""

# Slot 9: Change Detection Method
# Options: difference_threshold | percent_change | trend
change_method:
  type: "difference_threshold"
  gain_threshold: 0.10
  loss_threshold: -0.10

# Slot 10: Storage Adapter
# Options: local | gcs
storage:
  type: "local"
  local_processed_dir: "data/processed"
  dashboard_data_dir: "dashboard/public/data"
  gcs_bucket: ""

# Slot 11: Dashboard Setup
# Options: static_vite
dashboard:
  type: "static_vite"
  port: 5173
  title: "India Urban & National Green Cover Intelligence (2000-2025)"

# Slot 12: Basemap Provider
# Options: osm_standard | esri_satellite | openfreemap_positron | carto_dark_keyed
basemap:
  active: "osm_standard"
  providers:
    osm_standard:
      name: "OpenStreetMap Standard (Light)"
      url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
      attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors"
      max_zoom: 19
    esri_streets:
      name: "Esri World Street Map (Keyless English Labels)"
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"
      attribution: "Tiles &copy; Esri &mdash; English Cartographic Labels"
      max_zoom: 19
    esri_satellite:
      name: "Esri World Imagery (Satellite)"
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      attribution: "Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and GIS User Community"
      max_zoom: 18
    openfreemap_positron:
      name: "OpenFreeMap Positron (Keyless Clean)"
      url: "https://tiles.openfreemap.org/styles/positron"
      attribution: "&copy; <a href='https://openfreemap.org'>OpenFreeMap</a> &copy; OpenStreetMap contributors"
      max_zoom: 18
    carto_dark_keyed:
      name: "CARTO Dark Matter (Keyed)"
      url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?api_key={key}"
      env_key: "CARTO_API_KEY"
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
      max_zoom: 19

# Slot 13: Season Strategy (National vs City Tier)
# Options: pre_monsoon (Apr-May, isolates perennial canopy from rabi wheat) | fixed_window | annual_percentile | per_region
season_strategy:
  national_default: "pre_monsoon"
  pre_monsoon_months: [4, 5]
  city_default: "fixed_window"
  city_months: [1, 2, 3]

# Slot 14: Administrative Boundary Source
# Options: survey_of_india | geoboundaries
boundary_source:
  active: "survey_of_india"
  states_path: "data/boundaries/india_states.geojson"
  districts_path: "data/boundaries/india_districts.geojson"

# Slot 15: Compute Safety Caps
compute_safety:
  max_download_gb: 10.0
  max_runtime_hours: 2.0
  chunk_size_km: 100

# Slot 16: Forecast Projection
# Options: linear_trend | arima | prophet | off
forecast:
  method: "linear_trend"
  target_years: [2030, 2035]
  disclaimer: "Linear projection based on 4 decadal intervals; subject to small-sample assumptions."

# Slot 17: Area of Interest (AOI) - Bengaluru Primary City Baseline
# Format: [min_lon, min_lat, max_lon, max_lat] in EPSG:4326
area_of_interest:
  bbox: [77.46, 12.83, 77.75, 13.14]
  epsg_utm: 32643 # UTM Zone 43N for metric grid and area calculations
  validation_landmarks:
    lalbagh: [77.5855, 12.9507]
    cubbon_park: [77.5925, 12.9763]
    peenya_industrial: [77.5140, 13.0290]
    whitefield_itpl: [77.7472, 12.9863]
