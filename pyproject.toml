[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-green-cover"
version = "0.1.0"
description = "Urban Green-Cover Intelligence and Historical Change Analysis System for Bengaluru"
authors = [{ name = "Urban Green Cover Analytics" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pystac-client>=0.8.0",
    "planetary-computer>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
